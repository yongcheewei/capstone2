[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssh-bruteforce-hybrid"
version = "1.0.0"
description = "Hybrid rule-based + ML detection of SSH brute-force attacks on Linux auth logs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yong Chee Wei" }]
dependencies = [
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=1.26",
    "joblib>=1.4",
    "xgboost>=2.0",
    "imbalanced-learn>=0.12",
]

[project.optional-dependencies]
viz = ["matplotlib>=3.8", "seaborn>=0.13", "streamlit>=1.36"]
dev = ["pytest>=8.2", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
